# This project's entries in the radar-41 port registry, data band 21xxx.
# The registry of record is /opt/radar-41-ports/registry/ports.toml (merged
# 7 Nov 2026 into the Fleet_Profile registry); these entries are already in it
# under the names below. Kept here so the compose file and the registry change
# in the same commit, as the registry's own rule asks. `portctl env` exposes
# them as PORT_NEO4J_BOLT and PORT_NEO4J_HTTP; nothing in this repo reads those yet.

[[port]]
port = 21003
proto = "tcp"
name = "neo4j-bolt"
node = "head"
owner = "docker: data_retrival_neo4j (Data_Retrival/neo4j/compose.yaml)"
bind = "lo"
status = "active"
note = "FRED catalog graph, Bolt. Container port 7687; server.bolt.advertised_address matches."

[[port]]
port = 21004
proto = "tcp"
name = "neo4j-http"
node = "head"
owner = "docker: data_retrival_neo4j (Data_Retrival/neo4j/compose.yaml)"
bind = "lo"
status = "active"
note = "FRED catalog graph, HTTP API and Neo4j Browser. Container port 7474."

# Not a FRED port, but it is why the two above are not 7687/7474: the native
# Memgraph listens on 0.0.0.0:7687. Registered as memgraph-bolt (pinned).
[[port]]
port = 7687
proto = "tcp"
name = "memgraph-bolt"
node = "head"
owner = "memgraph.service"
bind = "any"
status = "active"
pinned = true
note = "Memgraph default Bolt port; binds all interfaces (/etc/memgraph/memgraph.conf --bolt-address)."
