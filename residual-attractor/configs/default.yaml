# Prototype values from the Architecture Specification (configuration table).
# Every key is required; see schemas/config.yaml.

horizon.H: 20
sigma.window: 40
sigma.floor_factor: 1.0e-6
sigma.failure_scale: one_step          # spec decision 1, proposed default (to confirm)
sigma.store_h_step: true               # spec decision 1: sigma_h stored beside sigma
sigma.break_policy: fixed_window_flag_breaks   # spec decision 3, proposed default (to confirm)
sigma.ddof: 1
sigma.break_detector: none            # no break detector chosen yet; flags stay <NA>
thresholds: [1, 2, 3, 4]
cadence.steady_ratio: 1.5
cadence.oscillation_drop: 0.5
lagcorr.K: 6
lagcorr.window: 24
lagcorr.min_pairs: 10
lagcorr.smoothing: mean3
base.closed: false
origins.stride: 1
registry.files: [ses.yaml, ar.yaml, holt.yaml, fused.yaml]
methods.ar.mean_window: expanding
methods.holt.init: first_value_zero_trend
methods.ses.init: first_value
fibers.include_fused: true            # spec decision 16, proposed default
fibers.axes: window_correlation       # spec decision 17, proposed default: W_sigma window for the forecast view
fibers.eig_tol: 1.0e-9
graph.mode: analysis
seed: 41
fixture.regime_length: 60
fixture.noise_sd: 1.0
fixture.test_fraction: 0.5
