# Prototype values from the Architecture Specification (configuration table).
# Every key is required; see schemas/config.yaml.

horizon.H: 20
sigma.window: 40
sigma.floor_factor: 1.0e-6
sigma.failure_scale: training_growth   # spec decision 1, decided 2026-11-12: sigma x training-span growth g_c(h)
sigma.store_h_step: true               # spec decision 1: sigma_h stored beside sigma
sigma.break_policy: fixed_window_flag_breaks   # spec decision 3: fixed window, unweighted; regime handling belongs to the analyses on the archive
sigma.ddof: 1
sigma.break_detector: none            # no break detector chosen yet; flags stay <NA>
thresholds: [1, 2, 3, 4]
cadence.steady_ratio: 1.5
cadence.steady_abs: 1.0
cadence.fail_level: 2.0
cadence.oscillation_levels: [2, 3, 4]
cadence.labels: [Holds, Immediate, Oscillating, Jump, Insufficient, Steady, Accelerating, Decelerating, Mixed]   # spec decision 4, decided 2026-11-12: the spec's nine, in its order
cadence.oscillation_drop: 0.5         # the spec's rule text (k - 0.5); its config table proposes 1.0
lagcorr.K: 6
lagcorr.window: 24
lagcorr.min_pairs: 10
lagcorr.smoothing: trailing3          # spec: 3-point mean applied to rho before arccos; trailing keeps past-lag theta causal
base.closed: false
origins.stride: 1
registry.files: [ses.yaml, ar.yaml, holt.yaml]
methods.ar.mean_window: expanding
methods.holt.init: first_value_zero_trend
methods.ses.init: first_value
compare.loss: squared                 # rdiag params.yaml (loss, mcs, fluctuation); stage 10 is rdiag's Stage 1 under v2
compare.mcs_alpha: 0.10
compare.mcs_n_boot: 5000
compare.mcs_block_length: 6.0
compare.fluctuation_window: 24
compare.fluctuation_alpha: 0.05
compare.cpa_instruments: [const, d_lag1]  # v2: rdiag's fused-row state instruments do not exist; Giacomini-White's own
surrogates.circular_shift_min_offset: 12  # rdiag surrogates: circular-shift offsets are drawn from [min, P - min]
surrogates.scope: per_configuration       # every configuration has its own draws; `shared` gives all of them the same draws
tails.n_tail_grid: [10, "floor(P / 4)"]    # rdiag tails.k_grid; rdiag's k (upper order statistics) is n_tail here, k is the configuration
tails.n_tail_rule: hill_stability          # rdiag tails.k_rule: least variance of gamma over a sliding range of n_tail
tails.n_tail_stability_width: 5            # rdiag tails.k_stability_width
tails.threshold_grid_quantiles: [0.70, 0.98, 0.01]   # rdiag: first, last, step
tails.threshold_rule: gpd_shape_stability  # rdiag: Coles (2001), threshold stability
tails.rolling_window: 36                   # rdiag
tails.rolling_n_tail: 6                    # rdiag tails.rolling_k
tails.min_exceed: 3                        # rdiag's postcondition n_exceed >= 3; a threshold with fewer exceedances is not fitted
tails.gpd_shape_min: -0.5                  # the shape is estimated over shape >= this; below -1/2 the likelihood has no regular optimum
tails.gpd_ci: profile_likelihood           # rdiag says "confidence intervals"; estimate +/- z se covers 29-76% at 5-30 exceedances, this one 91-99%
tails.gpd_ci_level: 0.95
graph.mode: analysis
seed: 41
fixture.regime_length: 60
fixture.noise_sd: 1.0
fixture.test_fraction: 0.5
# Track A, who leads by phase (rdiag params.yaml: wavelet, spectral_summary, coherence, adjacency, inference)
wavelet.family: morlet                    # Torrence and Compo (1998)
wavelet.omega0: 6.0
wavelet.period_min: 2.0                   # months; the Nyquist period of monthly data
wavelet.period_max_rule: "P / 3"          # the longest period is P / 3 months (32.7 at P = 98)
wavelet.voices_per_octave: 8              # dj = 1/8
wavelet.padding: zero
wavelet.coi: e_folding_sqrt2              # a cell is in the cone at least sqrt(2) x scale from both ends
wavelet.red_noise: ar1                    # the reference each row's power is judged against: its own AR(1)
wavelet.significance: 0.95
spectral_summary.band_rule: contiguous_above_red_noise   # bands = maximal runs of scales whose global spectrum clears the row's red noise
spectral_summary.min_band_scales: 2
spectral_summary.c_delta: 0.776           # Morlet reconstruction factor (Torrence and Compo, Table 2)
spectral_summary.gamma_decorrelation: 2.32   # Morlet time-decorrelation factor
spectral_summary.dj0_decorrelation: 0.60  # Morlet scale-decorrelation factor (their delta-j0); rdiag leaves it implicit in "eq. 26"
coherence.time_smoothing: gaussian_by_scale   # Grinsted, Moore and Jevrejeva (2004): Gaussian in time with sd = the scale
coherence.scale_smoothing_width: 0.6      # octaves, boxcar
coherence.quantile: 0.95
surrogates.n_coherence: 1000              # rdiag surrogates.n_coherence; when it is at least the number of distinct offsets, every offset is used once
adjacency.edge_weight: share_of_significant_incoi_cells
adjacency.edge_rule: binomial_exceedance  # an edge is kept if the share exceeds what 1 - coherence.quantile predicts, at inference.q
adjacency.per_band: true                  # false: the all-scales scope only
inference.cooccurrence_family_method: benjamini_yekutieli   # valid under any dependence (2001)
inference.q: 0.10
