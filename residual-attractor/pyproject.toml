[project]
name = "rattractor"
version = "0.1.0"
description = "Residual attractor space: configurations, forecast steps and residual fibers over FRED series"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
]

[project.scripts]
rattractor = "rattractor.cli:main"

[project.optional-dependencies]
catalog = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]
topology = ["ripser>=0.6.15", "persim>=0.4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rattractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
