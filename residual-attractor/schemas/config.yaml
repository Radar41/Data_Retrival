# Every key the build reads. The loader refuses a config that is missing any of
# them or carries one not listed here. No default lives in code.
# type: int | float | str | bool | list | path ; optional range or values.

horizon.H:                {type: int, min: 1}
sigma.window:             {type: int, min: 2}          # W_sigma
sigma.floor_factor:       {type: float, min: 0.0}      # sigma floor = factor x training-span std of the series
sigma.failure_scale:      {type: str, values: [one_step, model_h, training_growth]}  # decision 1: the scale cadence reads (r, r_h or r_g)
sigma.store_h_step:       {type: bool}                              # decision 1: sigma_h stored beside
sigma.break_policy:       {type: str, values: [fixed_window_flag_breaks]}  # decision 3, spec default
thresholds:               {type: list}                 # the four crossing levels in sigma, ascending (h1..h4)
cadence.steady_ratio:     {type: float, min: 1.0}      # Steady: max gap <= ratio x min gap ...
cadence.steady_abs:       {type: float, min: 0.0}      # ... or max gap - min gap <= abs
cadence.fail_level:       {type: float, min: 0.0}      # the level whose crossing is "h2": Holds, Immediate; one of thresholds
cadence.oscillation_levels: {type: list}               # levels checked for a fall-back after first reaching them; subset of thresholds
cadence.labels:           {type: list}                 # decision 4: the label rules, in priority order (first that applies)
cadence.oscillation_drop: {type: float, min: 0.0}
lagcorr.K:                {type: int, min: 1}
lagcorr.window:           {type: int, min: 2}          # W_rho
lagcorr.min_pairs:        {type: int, min: 2}
lagcorr.smoothing:        {type: str, values: [none, trailing3, centred3]}  # 3-point mean of rho along the base, before arccos
base.closed:              {type: bool}
origins.stride:           {type: int, min: 1}
registry.files:           {type: list}                 # paths under configs/registry/
methods.ar.mean_window:   {type: str}                  # "expanding" or an integer as text
methods.holt.init:        {type: str, values: [first_value_zero_trend]}
methods.ses.init:         {type: str, values: [first_value]}
graph.mode:               {type: str, values: [analysis, predictive]}
seed:                     {type: int}
fixture.regime_length:    {type: int, min: 8}
fixture.noise_sd:         {type: float, min: 0.0}
fixture.test_fraction:    {type: float, min: 0.0, max: 1.0}
sigma.ddof:               {type: int, min: 0, max: 1}  # sd divisor N - ddof over the W_sigma window
sigma.break_detector:     {type: str, values: [none]}  # decision 3: no detector yet, window_spans_break stays <NA>
compare.loss:             {type: str, values: [squared, absolute]}  # rdiag loss.function
compare.mcs_alpha:        {type: float, min: 0.0, max: 1.0}        # rdiag mcs.alpha
compare.mcs_n_boot:       {type: int, min: 1}                      # rdiag mcs.n_boot
compare.mcs_block_length: {type: float, min: 1.0}                  # rdiag mcs.block_length (mean of the stationary bootstrap)
compare.fluctuation_window: {type: int, min: 2}                    # rdiag fluctuation.window (m)
compare.fluctuation_alpha: {type: float, values: [0.05, 0.10]}     # the Giacomini-Rossi table's columns
compare.cpa_instruments:  {type: list}                             # from [const, d_lag1], all at t - 1
surrogates.circular_shift_min_offset: {type: int, min: 1}   # rdiag surrogates.circular_shift_min_offset
surrogates.scope:         {type: str, values: [per_configuration, shared]}  # whether configurations share surrogate draws (owner's choice; default keeps them apart)
# Track A, who leads by phase (rdiag params.yaml: wavelet, spectral_summary, coherence, adjacency, inference)
wavelet.family:           {type: str, values: [morlet]}             # rdiag wavelet.family
wavelet.omega0:           {type: float, min: 5.0}                   # rdiag wavelet.omega0; below about 5 the plain Morlet is not a wavelet
wavelet.period_min:       {type: float, min: 2.0}                   # rdiag wavelet.period_min, months (2 is the Nyquist period)
wavelet.period_max_rule:  {type: str}                               # rdiag wavelet.period_max_rule: "P / d", d a number >= 1
wavelet.voices_per_octave: {type: int, min: 1}                      # rdiag wavelet.voices_per_octave (dj = 1 / voices)
wavelet.padding:          {type: str, values: [zero]}               # rdiag wavelet.padding
wavelet.coi:              {type: str, values: [e_folding_sqrt2]}    # rdiag wavelet.coi
wavelet.red_noise:        {type: str, values: [ar1]}                # rdiag wavelet.red_noise
wavelet.significance:     {type: float, min: 0.0, max: 1.0}         # rdiag wavelet.significance; strictly inside (0, 1)
