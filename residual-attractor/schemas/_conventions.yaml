# Conventions every artifact schema follows.
dtypes:
  int16: numpy int16, no nulls
  int32: numpy int32, no nulls
  float32: numpy float32; NaN is the null when nullable
  float64: numpy float64; NaN is the null when nullable
  string: pandas "string" dtype; <NA> is the null when nullable
  bool: numpy bool, no nulls
  category: pandas categorical whose categories equal `values` exactly, in order
rules:
  - Column list and order are exact. Extra, missing or reordered columns fail.
  - Dtypes are exact. Nothing is cast on read or write.
  - primary_key columns are non-null and unique together.
  - Every artifact written by a build also carries build_id (added at write time, stage 1 onward).
time_axis: t is an integer step 0..N-1, contiguous per series. Calendar dates live in the catalog, not here.
