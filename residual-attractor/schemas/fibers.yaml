artifact: fibers
description: "one row per (series, origin, ladder, h): the section of the bundle, a collection of points. x holds every configuration's own standardized residual at that point (fiber_index gives the order). Nothing here combines residuals across configurations."
primary_key: [series_id, origin, ladder, h]
columns:
  - {name: series_id, dtype: string, nullable: false}
  - {name: origin, dtype: int32, nullable: false, unit: step}
  - {name: ladder, dtype: category, values: [backward, forward], nullable: false}
  - {name: h, dtype: int16, nullable: false, unit: step}
  - {name: step, dtype: int16, nullable: false, unit: step, notes: "h - H backward, h forward"}
  - {name: issuance, dtype: int32, nullable: false, unit: step, notes: "o forward, o - H backward"}
  - {name: x, dtype: "list[float32]", nullable: false, notes: "X_k = (y - yhat_k) / sigma_k(issuance) in fiber_index order; equals -u_f of each steps row"}
  - {name: issuance_switch, dtype: bool, nullable: false, notes: "true on the backward step 0 row whose next step is forward step 1 (issuance changes)"}
